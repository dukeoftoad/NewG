name: Android Alpha Release

on:
  push:
    tags:
      - 'alpha-v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: Alpha version name (for example, 1.0.0-alpha.1)
        required: true
        type: string
        default: '1.0.0-alpha.1'

permissions:
  contents: write

concurrency:
  group: android-alpha-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  alpha-release:
    name: Build and publish signed alpha APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate temporary alpha signing keystore
        id: alpha
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version_name }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version_name="${VERSION_INPUT}"
          else
            version_name="${GITHUB_REF_NAME#alpha-v}"
          fi

          if [[ ! "${version_name}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then
            echo "::error::Alpha version must use MAJOR.MINOR.PATCH-alpha.N (for example 1.0.0-alpha.1)."
            exit 1
          fi

          version_code=$((10000 + GITHUB_RUN_NUMBER))
          release_tag="alpha-v${version_name}"
          keystore_path="${RUNNER_TEMP}/alpha-upload-key.jks"
          store_password="$(openssl rand -hex 24)"
          key_password="$(openssl rand -hex 24)"

          keytool -genkeypair -v \
            -keystore "${keystore_path}" \
            -storepass "${store_password}" \
            -alias upload \
            -keypass "${key_password}" \
            -dname "CN=NewG Alpha,O=NewG,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          {
            echo "KEYSTORE_PATH=${keystore_path}"
            echo "STORE_PASSWORD=${store_password}"
            echo "KEY_PASSWORD=${key_password}"
          } >> "${GITHUB_ENV}"

          echo "version_name=${version_name}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${version_code}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"

      - name: Build signed alpha APK
        run: |
          gradle --no-daemon \
            -PversionName="${{ steps.alpha.outputs.version_name }}" \
            -PversionCode="${{ steps.alpha.outputs.version_code }}" \
            assembleRelease
          cp app/build/outputs/apk/release/app-release.apk \
            "app/build/outputs/apk/release/NewG-${{ steps.alpha.outputs.version_name }}-alpha.apk"

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.alpha.outputs.release_tag }}
          name: NewG ${{ steps.alpha.outputs.version_name }} (Alpha)
          prerelease: true
          generate_release_notes: true
          files: app/build/outputs/apk/release/NewG-${{ steps.alpha.outputs.version_name }}-alpha.apk
          fail_on_unmatched_files: true
