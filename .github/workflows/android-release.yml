name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed Android release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64}" || -z "${STORE_PASSWORD}" || -z "${KEY_PASSWORD}" ]]; then
            echo "::error::Configure KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD in repository Actions secrets."
            exit 1
          fi
          keystore_path="${RUNNER_TEMP}/upload-key.jks"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          echo "KEYSTORE_PATH=${keystore_path}" >> "${GITHUB_ENV}"
          echo "STORE_PASSWORD=${STORE_PASSWORD}" >> "${GITHUB_ENV}"
          echo "KEY_PASSWORD=${KEY_PASSWORD}" >> "${GITHUB_ENV}"

      - name: Build signed release APK and app bundle
        run: gradle --no-daemon assembleRelease bundleRelease

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
