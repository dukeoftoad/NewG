name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: Release version name (for example, 1.0.5)
        required: true
        type: string
        default: '1.0.5'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed Android release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore permanent release signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          # Permanent signing key: identical across every run so installed
          # builds stay update-compatible. The keystore lives in repo secrets
          # and is decoded into the runner's temp dir, never committed.
          keystore_path="${RUNNER_TEMP}/upload-key.jks"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"

          # Use JKS explicitly so the distinct store/key passwords are honored.
          keytool -list -keystore "${keystore_path}" \
            -storepass "${ANDROID_STORE_PASSWORD}" -alias upload > /dev/null

          {
            echo "KEYSTORE_PATH=${keystore_path}"
            echo "STORE_PASSWORD=${ANDROID_STORE_PASSWORD}"
            echo "KEY_PASSWORD=${ANDROID_KEY_PASSWORD}"
          } >> "${GITHUB_ENV}"

      - name: Derive release version from tag
        id: version
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version_name }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version_name="${VERSION_INPUT}"
          else
            version_name="${GITHUB_REF_NAME#v}"
          fi

          if [[ ! "${version_name}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release version must be X.Y.Z (tag v${version_name})."
            exit 1
          fi

          # Release versionCodes start at 20000 (alpha uses 10000+run), and
          # stay monotonic across re-runs since GITHUB_RUN_NUMBER only grows.
          version_code=$((20000 + GITHUB_RUN_NUMBER))

          echo "version_name=${version_name}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${version_code}" >> "${GITHUB_OUTPUT}"

      - name: Build signed release APK
        run: |
          gradle --no-daemon \
            -PversionName="${{ steps.version.outputs.version_name }}" \
            -PversionCode="${{ steps.version.outputs.version_code }}" \
            assembleRelease
          cp app/build/outputs/apk/release/app-release.apk \
            "app/build/outputs/apk/release/toadGALLERY-${{ steps.version.outputs.version_name }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: toadGALLERY ${{ steps.version.outputs.version_name }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/toadGALLERY-*.apk
