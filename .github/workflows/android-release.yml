name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed Android release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate temporary release signing keystore
        shell: bash
        run: |
          set -euo pipefail

          keystore_path="${RUNNER_TEMP}/upload-key.jks"
          store_password="$(openssl rand -hex 24)"
          key_password="$(openssl rand -hex 24)"

          # Mask generated credentials before exporting them to later steps.
          echo "::add-mask::${store_password}"
          echo "::add-mask::${key_password}"

          # Use JKS explicitly so the distinct store/key passwords are honored.
          keytool -genkeypair -v \
            -storetype JKS \
            -keystore "${keystore_path}" \
            -storepass "${store_password}" \
            -alias upload \
            -keypass "${key_password}" \
            -dname "CN=NewG Release,O=NewG,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          {
            echo "KEYSTORE_PATH=${keystore_path}"
            echo "STORE_PASSWORD=${store_password}"
            echo "KEY_PASSWORD=${key_password}"
          } >> "${GITHUB_ENV}"

      - name: Build signed release APK and app bundle
        run: gradle --no-daemon assembleRelease bundleRelease

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
